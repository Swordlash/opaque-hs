name: CI

# Builds and tests the package natively on every GHC the cabal file names
# (tested-with), against a libsodium built from source, since the runners'
# own is 1.0.18 and the package needs 1.0.19. One job also builds against
# that system library with the flag older-libsodium. The newest GHC's job
# does the checks that need doing once: the comparison with libopaque, the
# haddocks, and the package as Hackage would take it. One job builds for
# GHC's WebAssembly backend, with the flag wasm-libsodium, and runs the
# tests as a WASI module. Two jobs build the client of the browser backends
# (WebAssembly without the flag, and the JavaScript backend), and run it
# under Node against the native server and client. One job builds and runs
# the README's example.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `shell: bash` names bash with -o pipefail, which the default shell of a
# step lacks: a command that fails before a pipe (`cabal haddock | tee`)
# then fails its step.
defaults:
  run:
    shell: bash

env:
  CABAL_VERSION: '3.16.1.0'
  NODE_VERSION: '24'
  # The newest GHC of the matrix: its job runs the checks done once.
  NEWEST_GHC: '9.14.1'
  # Part of the cabal store's cache key: bump it to start the store anew.
  CACHE_TAG: 'v1'
  # The wasm compiler, and the ghc-wasm-meta revision it is installed
  # from. Keep WASM_GHC_VERSION in step with with-compiler in
  # cabal-wasm.project.
  WASM_GHC_VERSION: '9.14.1.20260731'
  GHC_WASM_META_REV: '358ea50b8496a69da6ce375c0c58bc049dbcb92d'
  GHC_WASM_FLAVOUR: '9.14'
  # The JavaScript cross compiler, from ghcup's cross channel, and the
  # emsdk it is installed and used under. Keep GHCJS_VERSION in step with
  # with-compiler in cabal-js-client.project.
  GHCJS_VERSION: '9.12.2'
  EM_VERSION: '3.1.74'
  FOURMOLU_VERSION: '0.21.0.0'
  # Of the release's fourmolu-<version>-linux-x86_64.zip.
  FOURMOLU_SHA256: 'aadf6931653df7b96f52014cf8eb4285a3e8778cd0b531499fc3ee013e1e00c7'

jobs:
  native:
    name: native (GHC ${{ matrix.ghc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.10.3', '9.12.4', '9.14.1']
    steps:
      - uses: actions/checkout@v5

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ env.CABAL_VERSION }}

      # For the tests against @serenity-kit/opaque, which runs under Node.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache libsodium
        uses: actions/cache@v5
        with:
          path: .libsodium
          key: ${{ runner.os }}-${{ runner.arch }}-libsodium-${{ hashFiles('scripts/libsodium.sh') }}

      - name: Build libsodium
        run: |
          sh scripts/libsodium.sh install
          sh scripts/libsodium.sh env >> "$GITHUB_ENV"

      # The dependencies, built once for each GHC: the key is cabal's
      # version and GHC's, and nothing of the sources, since cabal itself
      # works out what a change needs built. A cache is written once under
      # its key, so after a change of the dependencies (the index pin in
      # cabal.project) bump CACHE_TAG, or each run builds the difference
      # again. The setup action says where it put cabal's store.
      - name: Cache the cabal store
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-${{ runner.arch }}-cabal-store-${{ env.CACHE_TAG }}-cabal-${{ env.CABAL_VERSION }}-ghc-${{ matrix.ghc }}

      - name: Install @serenity-kit/opaque
        run: npm ci --ignore-scripts

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test opaque-test --test-show-details=direct

      # The interoperability tests skip, as pending, where Node or the
      # package is missing. Here they must run.
      - name: Check that the tests against serenity-kit ran
        run: |
          log=$(find dist-newstyle -name 'opaque-hs-*-opaque-test.log' | head -n 1)
          if grep -q 'skipped:' "$log"; then
            echo "The tests against @serenity-kit/opaque were skipped:" >&2
            grep 'skipped:' "$log" >&2
            exit 1
          fi

      - name: Cache the reference implementation
        if: matrix.ghc == env.NEWEST_GHC
        uses: actions/cache@v5
        with:
          path: .reference
          key: ${{ runner.os }}-${{ runner.arch }}-reference-${{ hashFiles('scripts/reference.sh', 'scripts/libsodium.sh') }}

      - name: Test against libopaque
        if: matrix.ghc == env.NEWEST_GHC
        run: |
          sh scripts/reference.sh install
          export PKG_CONFIG_PATH="$PWD/.reference/lib/pkgconfig:$PKG_CONFIG_PATH"
          cabal test opaque-reference -freference --test-show-details=direct

      # Hackage builds the haddocks; a warning there is a broken link in
      # the documentation.
      - name: Haddocks, without warnings
        if: matrix.ghc == env.NEWEST_GHC
        run: |
          cabal haddock opaque-hs 2>&1 | tee haddock.log
          if grep -E 'Warning|could not find link destinations|Missing documentation' haddock.log; then
            echo "The haddocks have warnings." >&2
            exit 1
          fi

      # The package as Hackage takes it: its description checked, and the
      # source distribution built on its own, outside the repository.
      - name: Check the package, and build its source distribution
        if: matrix.ghc == env.NEWEST_GHC
        run: |
          cabal check
          cabal sdist --output-directory "$RUNNER_TEMP/sdist"
          mkdir "$RUNNER_TEMP/from-sdist"
          tar xzf "$RUNNER_TEMP"/sdist/opaque-hs-*.tar.gz --strip-components=1 --directory "$RUNNER_TEMP/from-sdist"
          # What only the browser backends compile, which the build below
          # would not miss, and the project files of the other backends
          # with the one they import.
          for file in jsbits/opaque.js src-serenity/Crypto/OPAQUE/Client.hs test-client/Main.hs \
            test-client/driver.js interop/client-wasm.mjs scripts/client.sh \
            cabal.project cabal-wasm.project cabal-wasm-client.project cabal-js-client.project; do
            test -f "$RUNNER_TEMP/from-sdist/$file" || { echo "The source distribution lacks $file." >&2; exit 1; }
          done
          cd "$RUNNER_TEMP/from-sdist"
          cabal build --enable-tests

  # The flag older-libsodium: the system's libsodium 1.0.18, with the
  # package's own HKDF over libsodium's HMAC.
  older-libsodium:
    name: native (libsodium 1.0.18)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.NEWEST_GHC }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the system's libsodium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsodium-dev pkg-config
          pkg-config --modversion libsodium

      # The store the native job of this GHC saves: the dependencies are
      # the same. Restored only, so that the two jobs do not both write it.
      - name: Restore the cabal store
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-${{ runner.arch }}-cabal-store-${{ env.CACHE_TAG }}-cabal-${{ env.CABAL_VERSION }}-ghc-${{ env.NEWEST_GHC }}

      - name: Install @serenity-kit/opaque
        run: npm ci --ignore-scripts

      - name: Build and test
        run: cabal test opaque-test -folder-libsodium --test-show-details=direct

  # GHC's WebAssembly backend: the package over a libsodium compiled for
  # wasm32-wasi (the flag wasm-libsodium), and its tests run as a WASI
  # module under wasmtime, which the toolchain brings.
  wasm:
    name: wasm (GHC 9.14.1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/wasm-toolchain
        with:
          ghc-version: ${{ env.WASM_GHC_VERSION }}
          meta-rev: ${{ env.GHC_WASM_META_REV }}
          flavour: ${{ env.GHC_WASM_FLAVOUR }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Cache libsodium for wasm32-wasi
        uses: actions/cache@v5
        with:
          path: .libsodium-wasm
          key: ${{ runner.os }}-${{ runner.arch }}-libsodium-wasm-${{ env.GHC_WASM_META_REV }}-${{ hashFiles('scripts/libsodium.sh') }}

      - name: Build libsodium for wasm32-wasi
        run: sh scripts/libsodium.sh install-wasm

      - name: Cache the cabal store
        uses: actions/cache@v5
        with:
          path: ~/.cabal/store
          key: ${{ runner.os }}-${{ runner.arch }}-cabal-store-${{ env.CACHE_TAG }}-cabal-${{ env.CABAL_VERSION }}-ghc-wasm32-wasi-${{ env.WASM_GHC_VERSION }}

      - name: Build
        run: |
          cabal update
          # shellcheck disable=SC2046
          cabal --project-file=cabal-wasm.project build all $(sh scripts/libsodium.sh env-wasm)

      # hspec's exit status is the module's. All of the suite runs but the
      # tests that drive Node, which one pending example stands for.
      - name: Test, as a WASI module
        run: |
          module=$(find dist-newstyle -name opaque-test.wasm | head -n 1)
          test -n "$module"
          wasmtime run "$module"

  # The client of the browser backends on GHC's WebAssembly backend,
  # without the flag wasm-libsodium: Crypto.OPAQUE.Client over
  # @serenity-kit/opaque. The compiled client runs under Node, by itself
  # and against the native server and client, so the job also builds the
  # native test suite.
  wasm-client:
    name: wasm client (GHC 9.14.1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/wasm-toolchain
        with:
          ghc-version: ${{ env.WASM_GHC_VERSION }}
          meta-rev: ${{ env.GHC_WASM_META_REV }}
          flavour: ${{ env.GHC_WASM_FLAVOUR }}
          cabal-version: ${{ env.CABAL_VERSION }}

      # This job's dependencies for both compilers: the client's for
      # wasm32-wasi and the native test suite's.
      - name: Cache the cabal store
        uses: actions/cache@v5
        with:
          path: ~/.cabal/store
          key: ${{ runner.os }}-${{ runner.arch }}-cabal-store-${{ env.CACHE_TAG }}-cabal-${{ env.CABAL_VERSION }}-ghc-wasm32-wasi-${{ env.WASM_GHC_VERSION }}-client-host-${{ env.NEWEST_GHC }}

      - name: Install @serenity-kit/opaque
        run: npm ci --ignore-scripts

      # The compiler is named on the command line too: with a native GHC
      # on PATH, cabal may check that GHC's ghc-pkg against the cross
      # compiler and refuse ("Version mismatch between ghc and ghc-pkg"),
      # which with-hc-pkg in the project file does not prevent.
      - name: Build the client
        run: |
          cabal update
          cabal --project-file=cabal-wasm-client.project --builddir=dist-newstyle/wasm-client \
            --with-compiler="$(command -v "wasm32-wasi-ghc-$WASM_GHC_VERSION")" \
            --with-hc-pkg="$(command -v "wasm32-wasi-ghc-pkg-$WASM_GHC_VERSION")" \
            build all

      - uses: ./.github/actions/client-test
        with:
          backend: wasm
          host-ghc: ${{ env.NEWEST_GHC }}

  # The same client on GHC's JavaScript backend.
  js-client:
    name: js client (GHC 9.12.2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Use ~/.cabal for cabal's files
        run: echo "CABAL_DIR=$HOME/.cabal" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # emsdk is installed by hand, at a path that is the same in every
      # run: ghcup records the absolute path of emcc in the cross
      # compiler's settings, so a compiler restored from its cache works
      # only if emcc is still where it was when the compiler was installed.
      - name: Cache emsdk
        uses: actions/cache@v5
        with:
          path: ~/emsdk
          key: ${{ runner.os }}-${{ runner.arch }}-emsdk-${{ env.EM_VERSION }}

      - name: Install emsdk
        run: |
          if [ ! -d "$HOME/emsdk/.git" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          cd "$HOME/emsdk"
          ./emsdk install "$EM_VERSION"
          ./emsdk activate "$EM_VERSION"

      # EM_CONFIG is passed on only when it has a value: an empty one is
      # taken as the path of the configuration, and emcc then finds none.
      - name: Activate emsdk
        run: |
          # shellcheck source=/dev/null
          . "$HOME/emsdk/emsdk_env.sh" >/dev/null 2>&1
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          if [ -n "${EM_CONFIG:-}" ]; then
            echo "EM_CONFIG=$EM_CONFIG" >> "$GITHUB_ENV"
          elif [ -f "$EMSDK/.emscripten" ]; then
            echo "EM_CONFIG=$EMSDK/.emscripten" >> "$GITHUB_ENV"
          fi
          {
            echo "$EMSDK"
            echo "$EMSDK/upstream/emscripten"
          } >> "$GITHUB_PATH"

      - name: Check emsdk
        run: |
          command -v emcc emconfigure
          emcc --check

      # Only the one cross compiler under ghcup's directory, which also
      # holds the image's own GHCs. The compiler names emcc by its path, so
      # the key names the emsdk it was installed under.
      - name: Cache the JavaScript compiler
        uses: actions/cache@v5
        with:
          path: /usr/local/.ghcup/ghc/javascript-unknown-ghcjs-${{ env.GHCJS_VERSION }}
          key: ${{ runner.os }}-${{ runner.arch }}-ghcup-ghcjs-${{ env.GHCJS_VERSION }}-emsdk-${{ env.EM_VERSION }}-home

      # With the ghcup the runner's image ships, as the wasm jobs do. The
      # compiler's own bin directory goes on PATH, not ghcup's: the links
      # in ghcup's are made at install time, and are not there when the
      # compiler comes from the cache.
      - name: Install GHC's JavaScript toolchain
        run: |
          ghcup config add-release-channel cross
          if ! ghcup whereis cabal "$CABAL_VERSION" >/dev/null 2>&1; then
            ghcup install cabal "$CABAL_VERSION"
          fi
          ghcup set cabal "$CABAL_VERSION"
          if ! ghcup whereis ghc "javascript-unknown-ghcjs-$GHCJS_VERSION" >/dev/null 2>&1; then
            emconfigure ghcup install ghc "javascript-unknown-ghcjs-$GHCJS_VERSION"
          fi
          echo "$(ghcup whereis basedir)/ghc/javascript-unknown-ghcjs-$GHCJS_VERSION/bin" >> "$GITHUB_PATH"
          echo "$(ghcup whereis basedir)/bin" >> "$GITHUB_PATH"

      # This job's dependencies for both compilers: the client's for the
      # JavaScript backend and the native test suite's.
      - name: Cache the cabal store
        uses: actions/cache@v5
        with:
          path: ~/.cabal/store
          key: ${{ runner.os }}-${{ runner.arch }}-cabal-store-${{ env.CACHE_TAG }}-cabal-${{ env.CABAL_VERSION }}-ghc-javascript-${{ env.GHCJS_VERSION }}-client-host-${{ env.NEWEST_GHC }}

      - name: Install @serenity-kit/opaque
        run: npm ci --ignore-scripts

      # The compiler is named on the command line, as in the wasm client's
      # job.
      - name: Build the client
        run: |
          cabal update
          cabal --project-file=cabal-js-client.project --builddir=dist-newstyle/js-client \
            --with-compiler="$(command -v "javascript-unknown-ghcjs-ghc-$GHCJS_VERSION")" \
            --with-hc-pkg="$(command -v "javascript-unknown-ghcjs-ghc-pkg-$GHCJS_VERSION")" \
            build all

      - uses: ./.github/actions/client-test
        with:
          backend: js
          host-ghc: ${{ env.NEWEST_GHC }}

  # The example of the README, examples/servant: a servant server and its
  # client in one program, which exits with a failure when a step does not
  # go as it should. It has a project file and a store of its own, so that
  # the jobs above do not build servant and warp.
  example:
    name: example (servant)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ env.NEWEST_GHC }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Cache libsodium
        uses: actions/cache@v5
        with:
          path: .libsodium
          key: ${{ runner.os }}-${{ runner.arch }}-libsodium-${{ hashFiles('scripts/libsodium.sh') }}

      - name: Build libsodium
        run: |
          sh scripts/libsodium.sh install
          sh scripts/libsodium.sh env >> "$GITHUB_ENV"

      - name: Cache the cabal store
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-${{ runner.arch }}-cabal-store-${{ env.CACHE_TAG }}-cabal-${{ env.CABAL_VERSION }}-ghc-${{ env.NEWEST_GHC }}-example

      - name: Build and run the example
        run: cabal --project-file=cabal-examples.project run opaque-hs-servant-example

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Cache fourmolu
        uses: actions/cache@v5
        with:
          path: ~/fourmolu
          key: ${{ runner.os }}-fourmolu-${{ env.FOURMOLU_VERSION }}-${{ env.FOURMOLU_SHA256 }}

      # The release's zip, checked against the pinned checksum, with the
      # one binary inside it.
      - name: Install fourmolu
        run: |
          mkdir -p ~/fourmolu
          if [ ! -x ~/fourmolu/fourmolu ]; then
            zip="$HOME/fourmolu/fourmolu.zip"
            curl --fail --location --retry 5 --silent --show-error --output "$zip" \
              "https://github.com/fourmolu/fourmolu/releases/download/v$FOURMOLU_VERSION/fourmolu-$FOURMOLU_VERSION-linux-x86_64.zip"
            printf '%s  %s\n' "$FOURMOLU_SHA256" "$zip" | sha256sum --check --status
            # The binary is inside a directory of the zip; -j leaves the
            # directory out.
            unzip -q -o -j "$zip" '*/fourmolu' -d ~/fourmolu
            chmod 755 ~/fourmolu/fourmolu
            rm "$zip"
          fi
          ~/fourmolu/fourmolu --version
          echo "$HOME/fourmolu" >> "$GITHUB_PATH"

      - name: Check the formatting
        run: fourmolu --mode check src src-libsodium src-serenity test test-client test-libsodium test-older test-native test-wasm test-reference examples
